<!-- Set R cover, direction L "Lens", from docs/cover-lab-pixel.html
     (Malik, 2026-09-23). The glass steps in along the line one cell at a
     time, the words resolve only when it stops on the flaw, and one glint
     marks the moment. It plays once (3.3s, inside WCAG 2.2.2's five
     seconds) and rests on the hero frame, which is cover.png.
     The blog card inlines this file (components/blog/motionCover.tsx):
     `cover-play` on the root runs the motion, and re-adding it replays it.
     Every name is prefixed because inline, this <style> is page-wide.
     Motion runs only under no-preference; reduced motion gets the rest
     frame. -->
<style>
.lens-spotted{opacity:0}
@keyframes lens-arrive{0%{transform:translateX(200px)}40%,100%{transform:translateX(0)}}
@keyframes lens-resolve{0%{opacity:0}40%,100%{opacity:1}}
@keyframes lens-spotted{0%{opacity:0}41%{opacity:1}47%,100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){
.cover-play .lens-arrive{animation:lens-arrive 3.3s steps(10) 1}
.cover-play .lens-resolve{animation:lens-resolve 3.3s step-end 1}
.cover-play .lens-spotted{animation:lens-spotted 3.3s step-end 1}
}
</style>
