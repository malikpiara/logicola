<!doctype html>
<meta charset="utf-8" />
<title>The Material figure — LogiCola Lab</title>
<style>
  :root {
    --plum: #3f0167;
    --ink: #14110f;
    --muted: #6e5f68;
    --grid: color-mix(in srgb, #3f0167 16%, transparent);
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, monospace;
  }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font:
      15px/1.5 system-ui,
      -apple-system,
      'Segoe UI',
      sans-serif;
  }
  /* The figure is captured at 760px → 1520px, the article's other figures' width. */
  .fig {
    width: 760px;
    box-sizing: border-box;
    padding: 28px 24px 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 28px;
    row-gap: 0;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .smooth,
  .pixel {
    width: 144px;
    height: 144px;
    display: grid;
    place-items: center;
  }
  .smooth svg,
  .pixel svg {
    width: 144px;
    height: 144px;
    overflow: visible;
  }
  .arrow {
    height: 26px;
    display: grid;
    place-items: center;
    color: color-mix(in srgb, var(--ink) 35%, transparent);
  }
  .arrow svg {
    width: 14px;
    height: 14px;
  }
  /* the four-pixel grid, magnified ×3 (cell = 12px) — a figure, not a screen */
  .pixel {
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 12px 12px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 12px 12px;
    background-color: color-mix(in srgb, var(--plum) 3%, transparent);
    border-radius: 6px;
  }
  .cap {
    margin-top: 16px;
    width: 100%;
  }
  .name {
    font: 700 13px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .verdict {
    display: inline-block;
    font: 700 10px var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 3px 7px;
    margin-right: 8px;
    color: #fff;
    background: #8a94a0;
    vertical-align: 2px;
  }
  .verdict.picked {
    background: var(--plum);
  }
  .note {
    font: 14px/1.5 var(--mono);
    color: var(--muted);
    margin: 0;
  }
  .note b {
    color: var(--ink);
    font-weight: 700;
  }
  .atsize {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    font: 12.5px var(--mono);
    color: var(--muted);
  }
  .chip {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    background: var(--plum);
    color: #fff;
    font: 700 13px var(--mono);
    clip-path: polygon(
      37.5% 0%,
      62.5% 0%,
      62.5% 12.5%,
      75% 12.5%,
      75% 25%,
      87.5% 25%,
      87.5% 37.5%,
      100% 37.5%,
      100% 62.5%,
      87.5% 62.5%,
      87.5% 75%,
      75% 75%,
      75% 87.5%,
      62.5% 87.5%,
      62.5% 100%,
      37.5% 100%,
      37.5% 87.5%,
      25% 87.5%,
      25% 75%,
      12.5% 75%,
      12.5% 62.5%,
      0% 62.5%,
      0% 37.5%,
      12.5% 37.5%,
      12.5% 25%,
      25% 25%,
      25% 12.5%,
      37.5% 12.5%
    );
  }
  .legend {
    grid-column: 1 / -1;
    margin: 22px 0 0;
    font: 11px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 45%, transparent);
  }
</style>

<div class="fig" id="fig">
  <!-- 1 · Puffy diamond → the chip -->
  <div class="cell">
    <div class="smooth">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          fill="#3f0167"
          d="M50 3 Q77 23 97 50 Q77 77 50 97 Q23 77 3 50 Q23 23 50 3 Z"
        />
      </svg>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <polygon
          points="11 2 13 2 13 16 16 16 16 18 14 18 14 20 10 20 10 18 8 18 8 16 11 16"
        />
      </svg>
    </div>
    <div class="pixel">
      <!-- 2·4·6·8·8·6·4·2 cells on the 4px grid, cell = 12px here -->
      <svg viewBox="0 0 96 96" aria-hidden="true" shape-rendering="crispEdges">
        <path
          fill="#3f0167"
          d="M36 0h24v12h12v12h12v12h12v24H84v12H72v12H60v12H36V84H24V72H12V60H0V36h12V24h12V12h12z"
        />
      </svg>
    </div>
    <div class="cap">
      <p class="name">Puffy diamond</p>
      <p class="note">
        <span class="verdict picked">Picked</span>Became the chip beside every
        option.
      </p>
      <div class="atsize">
        <span class="chip">1</span>at the size you meet it, 32 px
      </div>
    </div>
  </div>

  <!-- 2 · Clam-shell arch -->
  <div class="cell">
    <div class="smooth">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path fill="#3f0167" d="M8 96 V54 A42 42 0 0 1 92 54 V96 Z" />
      </svg>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <polygon
          points="11 2 13 2 13 16 16 16 16 18 14 18 14 20 10 20 10 18 8 18 8 16 11 16"
        />
      </svg>
    </div>
    <div class="pixel">
      <!-- a semicircle sampled onto the grid: rows of 4·6·8·8 cells, then the shoulders -->
      <svg viewBox="0 0 96 96" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="#3f0167" d="M24 12h48v12h12v12h12v60H0V36h12V24h12z" />
      </svg>
    </div>
    <div class="cap">
      <p class="name">Clam-shell arch</p>
      <p class="note">
        <span class="verdict">Cut</span>[Why it was cut, in your words.]
      </p>
    </div>
  </div>

  <!-- 3 · Wavy indicator → square wave -->
  <div class="cell">
    <div class="smooth">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          fill="none"
          stroke="#3f0167"
          stroke-width="7"
          stroke-linecap="round"
          d="M4 50 C14 22 24 22 34 50 S54 78 64 50 S84 22 96 50"
        />
      </svg>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <polygon
          points="11 2 13 2 13 16 16 16 16 18 14 18 14 20 10 20 10 18 8 18 8 16 11 16"
        />
      </svg>
    </div>
    <div class="pixel">
      <svg viewBox="0 0 96 96" aria-hidden="true" shape-rendering="crispEdges">
        <g fill="#3f0167">
          <rect x="0" y="36" width="24" height="12" />
          <rect x="24" y="36" width="12" height="36" />
          <rect x="36" y="60" width="24" height="12" />
          <rect x="60" y="36" width="12" height="36" />
          <rect x="72" y="36" width="24" height="12" />
        </g>
      </svg>
    </div>
    <div class="cap">
      <p class="name">Wavy indicator</p>
      <p class="note">
        <span class="verdict">Cut</span>Read as ornament where a progress bar
        has to read as information.
      </p>
    </div>
  </div>

  <p class="legend">
    Material's shapes above · the four-pixel grid below, magnified ×3
  </p>
</div>
