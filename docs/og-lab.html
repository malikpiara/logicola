    <title>OG card lab — LogiCola</title>
    <!--
  OG CARD LAB (Malik asked for a redesign of the social preview, 2026-09-08).

  The link card is the one brand surface that carries a headline
  (docs/brand-decisions.md, 2026-08-12: "it is the one surface that
  genuinely wants a headline on it"), which is why docs/brand-lab.html
  cut it and why it gets its own lab. The shipped card
  (app/(marketing)/blog/[slug]/opengraph-image.tsx) is cream ground, a
  green "LogiCola" set in the default sans, and the title. Nothing from the
  redesign — the quilt, the set colours, the stretched display face, the
  wordmark — reaches it.

  Four directions, all 1200×630, all judged at feed size as well as 1:1:

    A · SCREEN   the 2008 composition from the article: a set surface as
                 the ground, a panel holding the title, and a dark band
                 along the foot that is the ground run through InvertRect
                 (band = ~ground, byte for byte). No pattern.
    B · MARK     cream ground, the wordmark top-left, the brand quilt
                 filling the right third, the title on the left.
    C · COVER    the post's own cover art as a strip across the top, the
                 title below on cream. Posts without a cover fall back to B.
    D · PLATE    the set's quilt full-bleed with a cream plate holding the
                 title. The quilt is the article's, so the card wears the
                 post's colours.

  DECIDED (Malik, 2026-09-08): D, "but the quilt maybe needs the same
  treatment and scale as the footer" — then, on seeing the full-bleed
  frame at 0.74: "Same footer treatment means only on the bottom and with
  higher scale." So the card is the footer's composition, not its
  number: mint ground, the title on a cream plate, and ONE band of quilt
  along the bottom edge, rows laid from the band's top so the cut lands
  on the canvas edge (footer.tsx's crop rule), the covers' nine at rate
  0.75, seed 45. Scale 2.00 is the covers' own (docs/brand-lab.html,
  decided 2026-08-12): 124px cells, 1.2 rows in a 154px band — the
  footer's "row and a fifth" at card size.

    E · FOOTER   mint ground, cream plate, quilt band along the bottom.
                 The one that ships (opengraph-image.tsx).
    F · FOOTER, NO PLATE  the same with the title straight on the mint,
                 as the footer itself sets its text. Kept for comparison.
    G · CREAM    E with the mint kept only behind the band: cream above,
                 so the plate dissolves into the card (Malik, 2026-09-08,
                 "one more variation and compare with E").

  SHIPPED: G, "but increase the top padding/margin of the band" — the
  route puts the mint 32px under the text block and the first quilt row
  16px into the mint (plus the generator's own cell padding). The lab
  keeps E/F/A/B/C/D for the record; the dials still render all of them.

  The quilt generator is the brand lab's quiltPixBody, byte for byte
  (which is itself lib/patterns.ts), with the lab's whole-cell clearing so
  a shape renders whole or not at all around a plate. The display face is
  the site's (Roboto Flex, wdth 151, weight 800, tracking -0.01em, the
  same as the post's h1). The mono line is the site's mono.

  Judge here, then port the winner to opengraph-image.tsx (Satori takes
  inline SVG, so the quilt can go in as rects or as a data-URI image).

  Capture mode for reviews: ?card=A&only=1 renders one card at 1200×630
  with no chrome. Headless Chrome:
    chrome --headless=new --window-size=1200,630 --screenshot=A.png \
      "file://…/docs/og-lab.html?card=A&only=1&scheme=L"
-->

    <style>
      :root {
        --cream: #edede3;
        --ink: #02302c;
        --green: #05a24b;
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f6f1;
        color: var(--ink);
        font-family: 'Roboto Flex', system-ui, sans-serif;
      }
      .lab {
        padding: 28px 32px 80px;
        max-width: 1320px;
        margin: 0 auto;
      }
      .lab h1 {
        font-stretch: 151%;
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: 30px;
        margin: 0 0 6px;
      }
      .lab p.note {
        font-family: var(--mono);
        font-size: 12.5px;
        color: #4c5b58;
        margin: 0 0 20px;
        max-width: 760px;
        line-height: 1.5;
      }
      .dials {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 22px;
        align-items: center;
        margin-bottom: 26px;
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .dials label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dials input[type='text'] {
        width: 320px;
        font: inherit;
        padding: 4px 6px;
      }
      .dials input[type='range'] {
        width: 120px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 560px;
        gap: 28px;
        align-items: start;
        margin-bottom: 44px;
      }
      .row h2 {
        grid-column: 1 / -1;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 -10px;
        color: #4c5b58;
      }
      .fit {
        width: 100%;
        aspect-ratio: 1200 / 630;
        overflow: hidden;
        border: 1px solid #d9d9cf;
      }
      .fit .card {
        transform-origin: 0 0;
      }
      .feed {
        font-family: var(--mono);
        font-size: 12px;
        color: #4c5b58;
      }
      .feed .frame {
        width: 520px;
        border: 1px solid #d9d9cf;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      .feed .thumb {
        width: 520px;
        height: 273px;
        overflow: hidden;
      }
      .feed .thumb .card {
        transform: scale(0.43333);
        transform-origin: 0 0;
      }
      .feed .meta {
        padding: 10px 14px 12px;
        color: #111;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      .feed .meta small {
        display: block;
        color: #6b6b6b;
        font-size: 12px;
        margin-top: 2px;
      }

      /* ---- the card ---- */
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
      }
      .card svg.field {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        display: block;
      }
      .title {
        font-stretch: 151%;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.04;
        margin: 0;
      }
      .meta-line {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 26px;
        letter-spacing: 0.01em;
      }
      .eyebrow {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* A · SCREEN */
      .card.A .panel {
        position: absolute;
        left: 64px;
        top: 64px;
        right: 64px;
        bottom: 150px;
        background: #fff;
        padding: 52px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card.A .band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 86px;
        display: flex;
        align-items: center;
        padding: 0 64px;
      }

      /* B · MARK */
      .card.B .mark {
        position: absolute;
        left: 64px;
        top: 56px;
        height: 92px;
        width: auto;
      }
      .card.B .copy {
        position: absolute;
        left: 64px;
        top: 200px;
        width: 660px;
      }
      .card.B .foot {
        position: absolute;
        left: 64px;
        bottom: 56px;
      }

      /* C · COVER */
      .card.C .strip {
        position: absolute;
        left: 0;
        top: 0;
        width: 1200px;
        height: 400px;
        object-fit: cover;
        object-position: center;
        image-rendering: pixelated;
        display: block;
      }
      /* 400 = the 3:1 cover shown whole at 1200 wide; the rows must not be cropped. */
      .card.C .copy {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 428px;
      }
      .card.C .foot {
        position: absolute;
        left: 64px;
        bottom: 34px;
      }

      /* E · FOOTER (plate) and F · FOOTER (no plate) */
      .card.E .plate {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 64px;
        height: 388px;
        background: var(--cream);
        padding: 44px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card.F .copy {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 64px;
        height: 388px;
        padding: 44px 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* D · PLATE */
      .card.D .plate {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 96px;
        bottom: 96px;
        background: var(--cream);
        padding: 52px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      body.only {
        background: transparent;
      }
      body.only .lab {
        display: none;
      }
      body.only .card {
        position: fixed;
        left: 0;
        top: 0;
      }
    </style>
  </head>

    <div class="lab">
      <h1>OG card lab</h1>
      <p class="note">
        Four directions for the link card. Left: 1:1 (scaled to fit). Right: how
        a feed shows it, 520px wide under a title line. Judge on the right; the
        left is for reading the type. Dials apply to every card.
      </p>
      <div class="dials">
        <label
          >Scheme
          <select id="scheme">
            <option value="brand">brand · cream</option>
            <option value="L" selected>L · mint / plum</option>
            <option value="C">C · lime / teal</option>
            <option value="A">A · rose / plum</option>
            <option value="J">J · lilac / green</option>
            <option value="N">N · sky / plum</option>
            <option value="Q">Q · lavender / violet</option>
            <option value="R">R · orchid / rust</option>
          </select>
        </label>
        <label
          >Title
          <input id="title" type="text" value="Back to the original formula"
        /></label>
        <label
          >Seed
          <input id="seed" type="range" min="1" max="60" value="45" /><span
            id="seedv"
            >45</span
          ></label
        >
        <label
          >Quilt scale
          <input
            id="scale"
            type="range"
            min="0.6"
            max="2.6"
            step="0.02"
            value="2"
          /><span id="scalev">2.00</span></label
        >
        <label
          >Rate
          <input
            id="rate"
            type="range"
            min="0.1"
            max="0.8"
            step="0.01"
            value="0.75"
          /><span id="ratev">0.75</span></label
        >
      </div>
      <div id="rows"></div>
    </div>

          d="M156.748 38.7834C159.938 38.1649 163.035 40.2194 163.705 43.3992C164.375 46.5789 162.371 49.7087 159.203 50.4304C157.107 50.9082 154.916 50.2184 153.472 48.6264C152.028 47.0342 151.554 44.7869 152.233 42.7474C152.912 40.7077 154.637 39.1924 156.748 38.7834Z"
        />
        <path
          class="mk-body"
          d="M233.936 19.1349C251.789 17.7166 239.851 38.6129 250.379 37.8346C267.404 36.5761 264.041 50.1224 264.046 63.0414L264.051 91.2104V123.837C264.049 129.63 264.106 135.52 263.974 141.304C263.931 143.147 263.674 144.957 262.804 146.477C259.254 152.682 253.379 150.532 248.174 151.717C243.501 152.779 246.099 161.659 244.166 165.054C242.509 167.967 240.816 168.917 237.641 170.012C226.571 171.454 226.324 162.029 226.091 154.637C225.946 149.949 216.029 152.164 212.229 150.007C205.604 146.244 207.446 135.128 207.446 128.24V102.3L207.444 67.1759C207.439 60.8564 207.389 54.5269 207.509 48.1979C207.614 45.4284 207.969 43.0269 209.869 40.9321C213.554 36.8134 218.556 38.5514 223.106 37.5271C228.366 36.3426 225.146 27.3919 227.489 23.8069C229.366 20.9306 230.886 20.0861 233.936 19.1349Z"
        />
        <path
          class="mk-cut"
          d="M230.619 75.6939C234.654 75.6299 240.499 75.0077 243.824 76.8724C244.229 77.5092 244.676 78.1877 244.959 78.8882C245.599 80.4622 245.586 122.861 245.269 127.459C245.211 128.269 244.994 129.059 244.631 129.784C243.881 131.315 242.804 131.842 241.301 132.338C237.424 132.36 233.494 132.421 229.621 132.286C227.249 130.973 226.464 129.947 226.366 127.275C226.249 124.048 226.296 120.832 226.296 117.604L226.291 99.8182C226.291 95.8469 226.046 81.4009 226.661 78.2817C228.146 76.6649 228.519 76.2857 230.619 75.6939Z"
        />
      </svg>
    </template>

    <script>
      /* ---- colour system (lifted from docs/brand-lab.html § 2) ---- */
      const SETS = {
        A: { surface: '#FFABC6', ink: '#4A1040', accent: '#674900' },
        C: { surface: '#E7F099', ink: '#02302C', accent: '#BD00AD' },
        J: { surface: '#E6ACF4', ink: '#1C3601', accent: '#674900' },
        L: { surface: '#CFF6DD', ink: '#3F0167', accent: '#BD00AD' },
        N: { surface: '#9EDAFF', ink: '#4A1040', accent: '#8D0381' },
        Q: { surface: '#D9CCF9', ink: '#3E1060', accent: '#745400' },
        R: { surface: '#E4BDF7', ink: '#751100', accent: '#824616' },
      };
      const BRAND = { cream: '#EDEDE3', green: '#05A24B', ink: '#02302C' };

      function schemeFor(key) {
        if (key === 'brand') {
          // The X header's chord: green shapes on cream, olive/brown/magenta accents.
          return {
            key,
            ground: BRAND.cream,
            ink: BRAND.green,
            type: BRAND.ink,
            pool: ['#674900', '#824616', '#BD00AD'],
            plate: '#ffffff',
          };
        }
        const s = SETS[key];
        // coverPool (lib/marketingTheme.ts): every other set's surface and ink,
        // minus inks too close to this set's own (the 0.09 ink gate). For L that
        // drops A/N (#4A1040) and Q (#3E1060) and leaves the footer's nine.
        const NEAR =
          {
            L: ['#4A1040', '#3E1060'],
            A: ['#3F0167', '#3E1060'],
            N: ['#3F0167', '#3E1060'],
            Q: ['#3F0167', '#4A1040'],
          }[key] || [];
        const pool = Object.entries(SETS)
          .filter(([k]) => k !== key)
          .flatMap(([, o]) => [o.surface, o.ink])
          .filter((c) => c !== s.ink && c !== s.surface && !NEAR.includes(c));
        return {
          key,
          ground: s.surface,
          ink: s.ink,
          type: s.ink,
          pool,
          plate: BRAND.cream,
        };
      }

      /* InvertRect: the band is the ground with every bit flipped (the article's rule). */
      function invert(hex) {
        const n = parseInt(hex.slice(1), 16) ^ 0xffffff;
        return '#' + n.toString(16).padStart(6, '0');
      }

      /* ---- generators (docs/brand-lab.html, byte for byte) ---- */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hidden(clear, x, y, ww, hh) {
        if (!clear) return false;
        const c = clear;
        if (x >= c.x + c.w || x + ww <= c.x || y >= c.y + c.h || y + hh <= c.y)
          return false;
        return true;
      }
      function quiltPixBody(opts) {
        const { w, h, ink, pool, scale, seed, clear, rate = 0.28 } = opts;
        const rng = mulberry32(seed >>> 0);
        const t = 62 * scale;
        const pad = t * 0.09;
        const cell = t - pad * 2;
        const cols = Math.ceil(w / t) + 1;
        const rows = Math.ceil(h / t) + 1;
        const accent = Array.from({ length: rows }, () =>
          Array(cols).fill(false)
        );
        const P = 7;
        let out = '';
        for (let i = 0; i < rows; i++) {
          for (let j = 0; j < cols; j++) {
            const left = j > 0 && accent[i][j - 1];
            const up = i > 0 && accent[i - 1][j];
            let fillCol = ink;
            if (pool.length && !left && !up && rng() < rate) {
              fillCol = pool[Math.floor(rng() * pool.length)];
              accent[i][j] = true;
            }
            const x = j * t + pad;
            const y = i * t + pad;
            const q = cell / P;
            const roll = rng();
            const fill = new Array(P * P);
            if (roll < 0.4) {
              for (let jj = 0; jj < P; jj++)
                for (let ii = 0; ii < P; ii++)
                  fill[jj * P + ii] = !(
                    (ii === 0 || ii === P - 1) &&
                    (jj === 0 || jj === P - 1)
                  );
            } else if (roll < 0.7) {
              const R = P / 2;
              for (let jj = 0; jj < P; jj++)
                for (let ii = 0; ii < P; ii++) {
                  const dx = ii + 0.5 - P / 2,
                    dy = jj + 0.5 - P / 2;
                  fill[jj * P + ii] = dx * dx + dy * dy <= R * R;
                }
            } else {
              const o = Math.floor(rng() * 4);
              const cx = o === 0 || o === 3 ? 0 : P;
              const cy = o === 0 || o === 1 ? 0 : P;
              for (let jj = 0; jj < P; jj++)
                for (let ii = 0; ii < P; ii++) {
                  const dx = ii + 0.5 - cx,
                    dy = jj + 0.5 - cy;
                  fill[jj * P + ii] = dx * dx + dy * dy <= P * P;
                }
            }
            let piece = `<g fill="${fillCol}" shape-rendering="crispEdges">`;
            for (let jj = 0; jj < P; jj++) {
              let ii = 0;
              while (ii < P) {
                if (!fill[jj * P + ii]) {
                  ii++;
                  continue;
                }
                let len = 0;
                while (ii + len < P && fill[jj * P + ii + len]) len++;
                piece += `<rect x="${x + ii * q}" y="${y + jj * q}" width="${len * q}" height="${q + 0.4}"/>`;
                ii += len;
              }
            }
            piece += '</g>';
            if (!hidden(clear, x, y, cell, cell)) out += piece;
          }
        }
        return out;
      }

      /* Centred lattice over a region (the brand lab's cover-only offset). */
      function field(region, s, cfg, clear) {
        const t = 62 * cfg.scale;
        const span = (len) => Math.ceil(len / t) * t + t;
        const ox = -(span(region.w) - region.w) / 2;
        const oy = -(span(region.h) - region.h) / 2;
        const clearLocal = clear
          ? {
              x: clear.x - region.x - ox,
              y: clear.y - region.y - oy,
              w: clear.w,
              h: clear.h,
            }
          : null;
        return (
          `<svg class="field" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">` +
          `<rect width="1200" height="630" fill="${s.ground}"/>` +
          `<g transform="translate(${region.x + ox} ${region.y + oy})">` +
          quiltPixBody({
            w: region.w - ox * 2,
            h: region.h - oy * 2,
            ink: s.ink,
            pool: s.pool,
            scale: cfg.scale,
            seed: cfg.seed,
            clear: clearLocal,
            rate: cfg.rate,
          }) +
          `</g></svg>`
        );
      }

      /* The footer band's lay: centred across, rows from the band's TOP so the
   second row is cut by the canvas bottom, never by a plate. */
      function bandField(region, s, cfg, canvasGround = s.ground) {
        const t = 62 * cfg.scale;
        const span = (len) => Math.ceil(len / t) * t + t;
        const ox = -(span(region.w) - region.w) / 2;
        return (
          `<svg class="field" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">` +
          `<rect width="1200" height="630" fill="${canvasGround}"/>` +
          `<rect x="${region.x}" y="${region.y}" width="${region.w}" height="${region.h}" fill="${s.ground}"/>` +
          `<g transform="translate(${region.x + ox} ${region.y})">` +
          quiltPixBody({
            w: region.w - ox * 2,
            h: region.h + t,
            ink: s.ink,
            pool: s.pool,
            scale: cfg.scale,
            seed: cfg.seed,
            clear: null,
            rate: cfg.rate,
          }) +
          `</g></svg>`
        );
      }

      const BAND = { x: 0, y: 476, w: 1200, h: 154 };

      function cardE(s, cfg, title) {
        return `<div class="card E" style="background:${s.ground};color:${s.type}">
    ${bandField(BAND, s, cfg)}
    <div class="plate" style="background:${s.plate}">
      <div class="eyebrow" style="color:${s.ink}">LogiCola · Blog</div>
      <h2 class="title" style="font-size:${titleSize(title, 936)}px;color:${s.ink}">${title}</h2>
      <div class="meta-line" style="color:${s.ink}">${META}</div>
    </div>
  </div>`;
      }

      function cardF(s, cfg, title) {
        return `<div class="card F" style="background:${s.ground};color:${s.type}">
    ${bandField(BAND, s, cfg)}
    <div class="copy">
      <div class="eyebrow" style="color:${s.ink}">LogiCola · Blog</div>
      <h2 class="title" style="font-size:${titleSize(title, 1056)}px;color:${s.ink}">${title}</h2>
      <div class="meta-line" style="color:${s.ink}">${META}</div>
    </div>
  </div>`;
      }

      function cardG(s, cfg, title) {
        return `<div class="card E" style="background:${BRAND.cream};color:${s.type}">
    ${bandField(BAND, s, cfg, BRAND.cream)}
    <div class="plate" style="background:${BRAND.cream}">
      <div class="eyebrow" style="color:${s.ink}">LogiCola · Blog</div>
      <h2 class="title" style="font-size:${titleSize(title, 936)}px;color:${s.ink}">${title}</h2>
      <div class="meta-line" style="color:${s.ink}">${META}</div>
    </div>
  </div>`;
      }

      const META = 'Sep 8, 2026 · logicola.org';

      function titleSize(title, maxWidth) {
        // Two lines at most. Roughly 0.5em per character at wdth 151.
        const perLine = maxWidth / (0.55 * 84);
        if (title.length <= perLine) return 84;
        if (title.length <= perLine * 2 * 0.95) return 84;
        return 68;
      }

      function cardA(s, cfg, title) {
        const band = invert(s.ground);
        return `<div class="card A" style="background:${s.ground};color:${s.type}">
    <div class="panel">
      <div class="eyebrow" style="color:${s.ink}">LogiCola · Blog</div>
      <h2 class="title" style="font-size:${titleSize(title, 1000)}px;color:${s.ink}">${title}</h2>
    </div>
    <div class="band" style="background:${band};color:${s.ground}"><span class="meta-line">${META}</span></div>
  </div>`;
      }

      function cardB(s, cfg, title) {
        const b = schemeFor('brand');
        const region = { x: 780, y: 0, w: 420, h: 630 };
        const mark = document
          .getElementById('wordmark')
          .innerHTML.replace(/class="mk-body"/g, `fill="${BRAND.green}"`)
          .replace(/class="mk-cut"/g, `fill="${BRAND.cream}"`);
        return `<div class="card B" style="background:${BRAND.cream};color:${BRAND.ink}">
    ${field(region, { ...b, ground: BRAND.cream }, cfg, null)}
    ${mark}
    <div class="copy"><h2 class="title" style="font-size:${titleSize(title, 660)}px">${title}</h2></div>
    <div class="foot meta-line" style="color:#4c5b58">${META}</div>
  </div>`;
      }

      function cardC(s, cfg, title) {
        return `<div class="card C" style="background:${BRAND.cream};color:${BRAND.ink}">
    <img class="strip" src="../public/blog/the-new-logicola/cover.png" alt="" />
    <div class="copy"><h2 class="title" style="font-size:${title.length <= 30 ? 60 : 50}px">${title}</h2></div>
    <div class="foot meta-line" style="color:#4c5b58">${META}</div>
  </div>`;
      }

      function cardD(s, cfg, title) {
        const plate = { x: 72, y: 96, w: 1056, h: 438 };
        const margin = 10;
        const clear = {
          x: plate.x - margin,
          y: plate.y - margin,
          w: plate.w + margin * 2,
          h: plate.h + margin * 2,
        };
        return `<div class="card D" style="background:${s.ground};color:${s.type}">
    ${field({ x: 0, y: 0, w: 1200, h: 630 }, s, cfg, clear)}
    <div class="plate" style="background:${s.plate}">
      <div class="eyebrow" style="color:${s.ink}">LogiCola · Blog</div>
      <h2 class="title" style="font-size:${titleSize(title, 936)}px;color:${s.ink}">${title}</h2>
      <div class="meta-line" style="color:${s.ink}">${META}</div>
    </div>
  </div>`;
      }

      const CARDS = {
        E: [
          'E · Footer — mint, cream plate, one quilt band along the bottom (ships)',
          cardE,
        ],
        F: ['F · Footer, no plate — the title straight on the mint', cardF],
        G: ['G · Cream — E with mint only behind the band', cardG],
        A: [
          'A · Screen — the 2008 composition: surface, panel, band = ~surface',
          cardA,
        ],
        B: ['B · Mark — wordmark, brand quilt on the right, title left', cardB],
        C: ['C · Cover — the post’s cover as a strip, title below', cardC],
        D: [
          'D · Plate — the set’s quilt full-bleed, cream plate for the title',
          cardD,
        ],
      };

      function readDials() {
        return {
          scheme: document.getElementById('scheme').value,
          title: document.getElementById('title').value,
          seed: +document.getElementById('seed').value,
          scale: +document.getElementById('scale').value,
          rate: +document.getElementById('rate').value,
        };
      }

      function render() {
        const d = readDials();
        document.getElementById('seedv').textContent = d.seed;
        document.getElementById('scalev').textContent = d.scale.toFixed(2);
        document.getElementById('ratev').textContent = d.rate.toFixed(2);
        const s = schemeFor(d.scheme);
        const rows = document.getElementById('rows');
        rows.innerHTML = '';
        for (const [key, [label, fn]] of Object.entries(CARDS)) {
          const html = fn(s, d, d.title);
          const row = document.createElement('section');
          row.className = 'row';
          row.innerHTML = `<h2>${label}</h2>
      <div class="fit"><div class="fitin">${html}</div></div>
      <div class="feed"><div class="frame"><div class="thumb">${html}</div>
        <div class="meta">${d.title}<small>logicola.org</small></div></div></div>`;
          rows.appendChild(row);
        }
        // scale the 1:1 previews to their column
        document.querySelectorAll('.fit').forEach((el) => {
          const k = el.clientWidth / 1200;
          el.querySelector('.card').style.transform = `scale(${k})`;
        });
      }

      const qs = new URLSearchParams(location.search);
      if (qs.get('only')) {
        document.body.classList.add('only');
        const key = qs.get('card') || 'A';
        const scheme = qs.get('scheme') || 'L';
        const title = qs.get('title') || 'Back to the original formula';
        const cfg = {
          seed: +(qs.get('seed') || 45),
          scale: +(qs.get('scale') || 2),
          rate: +(qs.get('rate') || 0.75),
        };
        document.body.insertAdjacentHTML(
          'beforeend',
          CARDS[key][1](schemeFor(scheme), cfg, title)
        );
      } else {
        for (const id of ['scheme', 'title', 'seed', 'scale', 'rate'])
          document.getElementById(id).addEventListener('input', render);
        window.addEventListener('resize', render);
        render();
      }
    </script>
  </body>
